[package]
name = "blas-rs"
version = "1.0.0-alpha.7"
edition = "2024"
authors = ["ronakgh {ronakgh97@gmail.com}"]
description = "Experimental F32 BLAS & Intel Math kernels library for x86_64 cpu"
license = "MIT"
repository = "https://github.com/ronakgh97/blas-rs"
readme = "README.md"
categories = ["mathematics", "algorithms", "memory-management", "science"]
keywords = ["blas", "simd", "math", "high-performance", "x86_64"]

[lib]
name = "blas_rs"
path = "src/lib.rs"

[[bin]]
name = "asm_runner"
path = "asm/runner.rs"

[[bench]]
name = "bencher"
path = "bench/bencher.rs"
harness = false

[[bench]]
name = "vtune"
path = "bench/vtune.rs"
harness = false

[profile.bench]
opt-level = 3
codegen-units = 1
lto = "fat"
debug = true

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
debug = false

[dependencies]
rand = "0.10.1"
rand_xoshiro = "0.8.1" # apparently faster than my impl of splitmix64 :(
# rayon = "1.12.0" # for cpu parallel computations

[dev-dependencies]
plotters = "0.3.7" # for plotting benchmarks
blas = "0.23.0" # for BLAS bindings, used in the reference implementation and benchmarks
intel-mkl-src = { version = "0.8.1", features = ["mkl-static-lp64-iomp"] }
core_affinity = "0.8.3"
# ittapi = "0.5.0" intel accurate tracing api
