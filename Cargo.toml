[package]
name = "blas_rs"
version = "0.1.0"
edition = "2024"
authors = ["ronakgh ronakgh97@gmail.com"]
description = "Experimental f32 BLAS kernels for x86_64 cpu"
license = "MIT"
repository = "https://github.com/ronakgh97/blas-rs"
readme = "README.md"
categories = ["mathematics", "no-std", "high-performance-computing", "science"]
keywords = ["blas", "simd", "math", "high-performance"]

[lib]
name = "blas_rs"
path = "src/lib.rs"

[[bench]]
name = "bencher"
path = "bench/bencher.rs"
harness = false

[[bin]]
name = "asm_runner"
path = "asm/runner.rs"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"

[dependencies]
fastrand = "2.4.1" # utils for random generation
# rayon = "1.12.0" # for cpu parallel computations

[dev-dependencies]
plotters = "0.3.7" # for plotting benchmarks
blas = "0.23.0" # for BLAS bindings, used in the reference implementation and benchmarks
# externel deps, make sure to have OpenBLAS installed on your system and properly linked, or it won't compile
# check readme for instructions
openblas-src = { version = "0.10.16", features = ["system"] }